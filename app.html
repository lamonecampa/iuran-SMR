<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portal SMR-ONE</title><link rel="stylesheet" href="assets/css/styles.css"><style>.portal{min-height:100vh;display:grid;place-items:center;padding:30px}.portal-card{width:min(480px,100%);background:white;border:1px solid #e8edf1;border-radius:16px;padding:34px;box-shadow:0 20px 60px #152b3c12}.portal-card h1{font:700 30px Manrope;color:#101b2d;margin:25px 0 10px}.portal-card p{font-size:13px;line-height:1.8;color:#718096}.portal-card label{display:block;font-size:11px;font-weight:700;margin:18px 0 7px}.portal-card input{width:100%;padding:14px;border:1px solid #dce4e9;border-radius:8px;font:inherit}.portal-card button{width:100%;margin-top:18px;border:0;cursor:pointer}.notice{font-size:10px!important;color:#946b20!important;background:#fff7e6;border-radius:8px;padding:12px}.back{font-size:11px;color:#16865e;font-weight:700}</head><body><main class="portal"><section class="portal-card"><a class="brand" href="index.html"><span class="brand-mark"><span></span><span></span><span></span></span><span><strong>SMR-ONE</strong><small>SEMPU MULIA RESIDENCE</small></span></a><h1 id="heading">Portal Warga</h1><p id="description">Masuk untuk melihat informasi tagihan dan pembayaran kavling Anda.</p><form id="loginForm"><label for="identity">Kode kavling / ID pengguna</label><input id="identity" autocomplete="username" placeholder="Contoh: KAV-08" required><label for="password">Kata sandi</label><input id="password" type="password" autocomplete="current-password" placeholder="Masukkan kata sandi" required><button class="button button-primary" type="submit">Masuk ke Dashboard <span>↗</span></button></form><p class="notice">Portal ini masih berupa kerangka antarmuka. Login belum diaktifkan sampai URL Google Apps Script dan skema autentikasi dikonfigurasi. Jangan memasukkan kata sandi asli.</p><a class="back" href="index.html">← Kembali ke homepage</a></section></main><script>const role=new URLSearchParams(location.search).get('role')==='admin'?'admin':'resident';if(role==='admin'){document.getElementById('heading').textContent='Dashboard Admin';document.getElementById('description').textContent='Masuk untuk mengelola data warga, tagihan, pembayaran, dan laporan.';document.getElementById('identity').placeholder='ID admin';}document.getElementById('loginForm').addEventListener('submit',e=>{e.preventDefault();alert('Login belum aktif. Hubungkan backend Google Apps Script terlebih dahulu.');});</script></body></html>
